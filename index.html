<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohoj Mart - সহজ মার্ট</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 10px;
    }
    .sohoj-banner {
      width: 100%;
      height: 180px;
      background-image: url(''); /* এখানে তোমার ব্যানার ছবির লিংক বা ফাইলের নাম দিতে পারো */
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background-color: #ddd;
    }
    .search-container {
      margin-bottom: 20px;
    }
    .search-box {
      width: 100%;
      padding: 12px 15px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 25px;
      outline: none;
      transition: 0.3s;
      box-sizing: border-box;
    }
    .search-box:focus {
      border-color: #ff9900;
    }
    .auth-card {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 50px auto;
    }
    .auth-btn {
      width: 100%;
      padding: 12px;
      background: #ff9900;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .auth-btn:hover {
      background: #e68a00;
    }
  </style>
</head>
<body>

  <!-- ১. ইমেজ ব্যানার -->
  <div class="sohoj-banner"></div>

  <!-- ২. সার্চ বার -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-box" placeholder="আপনার পছন্দের পণ্য সার্চ করুন..." onkeyup="searchProducts()">
  </div>

  <!-- ৩. লগইন স্ক্রিন -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>👤 সহজ মার্ট লগইন</h2>
      <input type="text" id="login-name" class="search-box" placeholder="আপনার নাম দিন" style="margin-bottom: 10px;">
      <input type="text" id="login-phone" class="search-box" placeholder="আপনার বিকাশ/মোবাইল নাম্বার দিন" style="margin-bottom: 15px;">
      <button class="auth-btn" onclick="loginApp()">প্রবেশ করুন</button>
    </div>
  </div>

  <script>
    // হোয়াটসঅ্যাপ নাম্বার সেট করা হলো
    const ownerWhatsAppNumber = "8801837197656";

    function searchProducts() {
      let input = document.getElementById('searchInput').value;
      // এখানে সার্চ লজিক কাজ করবে
    }

    function loginApp() {
      let name = document.getElementById('login-name').value;
      let phone = document.getElementById('login-phone').value;
      
      if(name === "" || phone === "") {
        alert("দয়া করে নাম এবং মোবাইল নাম্বার দিন!");
      } else {
        alert("স্বাগতম " + name + "! সফলভাবে লগইন হয়েছে।");
        // পরবর্তীতে মূল অ্যাপ স্ক্রিনে পাঠানোর কোড এখানে যুক্ত করা যাবে
      }
    }
  </script>

</body>
</html>
