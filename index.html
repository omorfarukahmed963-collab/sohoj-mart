<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohoj Mart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        /* নড়াচড়া করা ব্যানার বা নোটিশের স্টাইল */
        .moving-notice {
            background-color: #ff9900;
            color: #fff;
            padding: 10px;
            font-weight: bold;
            font-size: 16px;
        }
        .container {
            padding: 15px;
        }
        .order-box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .order-box input, .order-box textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .order-btn {
            background-color: #25D366;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ওপরের নড়াচড়া করা অংশ (Marquee) -->
    <div class="moving-notice">
        <marquee behavior="scroll" direction="left">
            স্বাগতম Sohoj Mart-এ! যেকোনো পণ্য অর্ডার করতে নিচের ফরম পূরণ করুন অথবা সরাসরি আমাদের হোয়াটসঅ্যাপ নম্বরে যোগাযোগ করুন।
        </marquee>
    </div>

    <div class="container">
        <h2>Sohoj Mart - অর্ডার পেজ</h2>
        
        <!-- কাস্টমার নাম-ঠিকানা এবং হোয়াটসঅ্যাপ অর্ডার ফর্ম -->
        <div class="order-box">
            <h3>হোয়াটসঅ্যাপে অর্ডার করুন</h3>
            <label for="custName">আপনার নাম:</label>
            <input type="text" id="custName" placeholder="আপনার নাম লিখুন">

            <label for="custPhone">আপনার মোবাইল নম্বর:</label>
            <input type="text" id="custPhone" placeholder="আপনার ফোন নম্বর লিখুন">

            <label for="custAddress">আপনার সম্পূর্ণ ঠিকানা:</label>
            <textarea id="custAddress" rows="3" placeholder="গ্রাম, থানা, জেলা লিখুন"></textarea>

            <button class="order-btn" onclick="sendToWhatsApp()">হোয়াটসঅ্যাপে অর্ডার কনফার্ম করুন</button>
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            let address = document.getElementById('custAddress').value;

            if(name === "" || phone === "" || address === "") {
                alert("দয়া করে নাম, ফোন নম্বর এবং ঠিকানা সঠিকভাবে পূরণ করুন!");
                return;
            }

            // এখানে তোমার হোয়াটসঅ্যাপ নম্বরটি বসানো আছে (+880 দিয়ে শুরু করবে)
            let adminPhone = "8801XXXXXXXXX"; // তোমার আসল হোয়াটসঅ্যাপ নম্বরটি এখানে বসিয়ে দিও

            let message = `*নতুন অর্ডার - Sohoj Mart*%0A` +
                          `👤 নাম: ${name}%0A` +
                          `📞 ফোন: ${phone}%0A` +
                          `🏠 ঠিকানা: ${address}`;

            let whatsappUrl = `https://wa.me/${adminPhone}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>

</body>
</html>
